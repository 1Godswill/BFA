{"name":"Build UBCOT APK","on":{"workflow_dispatch":null},"jobs":{"apk":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v3","with":{"gradle-version":"8.7"}},{"name":"Find project","run":"find . -iname 'sync-web*' -not -path './.git/*'; echo ---; ls -a; F=$(find . -name sync-web.sh -not -path './.git/*' | head -1); [ -n \"$F\" ] || { echo 'sync-web.sh NOT FOUND in repo'; exit 1; }; echo \"ROOT=$(dirname $(dirname $F))\" >> $GITHUB_ENV"},{"name":"Sync web","run":"cd $ROOT && sh android/sync-web.sh"},{"name":"Build","run":"cd $ROOT && gradle -p android assembleDebug"},{"uses":"actions/upload-artifact@v4","with":{"name":"UBCOT-apk","path":"**/build/outputs/apk/debug/*.apk"}}]}}}
