plugins { id 'com.android.application' }
android {
    namespace 'com.ubcot.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ubcot.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.3'
    }
    // Fixed signing key (committed) so every build is signed the same and new APKs install OVER the old one, keeping data.
    signingConfigs {
        debug {
            storeFile file('ubcot.keystore')
            storePassword 'ubcotfin'
            keyAlias 'ubcot'
            keyPassword 'ubcotfin'
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
